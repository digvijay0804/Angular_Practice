<h2>Template Driven Form + Signals</h2>

<input
  [ngModel]="name()"
  (ngModelChange)="name.set($event)"
  placeholder="Enter Your Name"
/>
<br><br>
<input
  [ngModel]="email()"
  (ngModelChange)="email.set($event)"
  placeholder="Enter Your Email"
/>
<br><br>

<button (click)="submitFrom()">Submit</button>
@if (message()) {
  <h3 class="success">{{ message() }}</h3>}
<hr>
<h3>Name: {{ name() | json}}</h3>
<h3>Email: {{ email() | json }}</h3>
